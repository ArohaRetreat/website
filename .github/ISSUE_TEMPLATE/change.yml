name: Change request
description: Feature, maintenance, documentation or infrastructure change
title: "[Change] "
type: Task
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and scope
    validations:
      required: true
  - type: textarea
    id: operations
    attributes:
      label: Operation budget and cost
      description: When usage changes, estimate operations and cost at typical and peak load. Identify the Firebase services, limits and measurements to verify.
  - type: textarea
    id: validation
    attributes:
      label: Tests, observability and release impact
      description: Record unknown decisions; never include secrets or customer data.
