name: Website application checks
on:
  pull_request:
  push:
    branches: [main, preprod]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install website and delivery-test dependencies
        run: |
          npm ci
          npm ci --prefix functions --ignore-scripts
      - name: Test and build independent website
        run: |
          node scripts/delivery/run-node-tests.mjs application
          npm run build
      - name: Retain bounded application test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-reports-application-${{ github.run_attempt }}
          path: .delivery-reports/*.jsonl
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
  website-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend and API dependencies
        run: |
          npm ci
          npm ci --prefix functions
      - name: Verify isolated API, rules and OTLP contracts
        run: |
          node scripts/delivery/run-node-tests.mjs api-telemetry
          node -e "require('node:fs').writeFileSync('functions/.env.local','SUPER_ADMIN_EMAILS=owner@example.test\n')"
          npx --yes firebase-tools@15.34.1 emulators:exec --project demo-aroha --only auth,firestore,functions,storage 'node scripts/delivery/run-node-tests.mjs api-integration'
      - name: Remove synthetic owner configuration
        if: always()
        run: node -e "require('node:fs').rmSync('functions/.env.local',{force:true})"
      - name: Verify isolated pre-production booking emails and invoices
        run: |
          AROHA_ENVIRONMENT=pre-prod node scripts/delivery/run-node-tests.mjs api-preprod-telemetry
          node scripts/test-preproduction.mjs
      - name: Verify scoped external API contract in isolated emulators
        run: node scripts/test-external.mjs
      - name: Verify manual booking, loyalty races and bounded large-record queries
        run: AROHA_LOYALTY_SCALE=1 node scripts/test-loyalty.mjs
      - name: Retain bounded API test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-reports-website-integration-${{ github.run_attempt }}
          path: |
            .delivery-reports/api-integration.jsonl
            .delivery-reports/api-telemetry.jsonl
            .delivery-reports/api-external.jsonl
            .delivery-reports/api-loyalty.jsonl
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Retain bounded pre-production test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-reports-preprod-${{ github.run_attempt }}
          path: |
            .delivery-reports/preprod-integration.jsonl
            .delivery-reports/api-preprod-telemetry.jsonl
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
