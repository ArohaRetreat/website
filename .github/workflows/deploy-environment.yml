name: Deploy environment frontend
on:
  push:
    branches: [main, preprod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'ArohaRetreat/website' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preprod') && (vars.AUTO_HOSTING_DELIVERY == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Require current branch source and all checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/delivery/check-environment-ci.mjs
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'pre-prod' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://aroharetreat.com' || 'https://aroha-retreat-preprod.web.app' }}
    permissions:
      contents: read
      id-token: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned build and delivery dependencies
        run: |
          npm ci
          npm ci --prefix functions --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/firebase-cli" --ignore-scripts firebase-tools@15.34.1
          echo "FIREBASE_CLI_PATH=$RUNNER_TEMP/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js" >> "$GITHUB_ENV"
      - name: Build branch-specific frontend
        env:
          AROHA_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'pre-prod' }}
          AROHA_BUILD_REVISION: ${{ github.sha }}
          AROHA_EMULATORS: '0'
        run: |
          npm run build
          node scripts/prepare-pinned-design.mjs
      - name: Recheck current source after build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/delivery/check-environment-ci.mjs
      - name: Authenticate with branch-bound short-lived identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_HOSTING_SERVICE_ACCOUNT }}
          project_id: aroha-retreat
      - name: Deploy only the matching Hosting site and verify
        env:
          DT_DELIVERY_TOKEN: ${{ secrets.DT_DELIVERY_TOKEN }}
        run: node scripts/deploy-frontend.mjs
      - name: Retain immutable deployment and transport receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: environment-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: local/delivery-outbox/*.json
          retention-days: 14
          if-no-files-found: warn
